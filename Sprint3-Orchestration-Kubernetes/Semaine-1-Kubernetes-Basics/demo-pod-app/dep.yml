apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-dep
spec:
  selector:
    matchLabels:
      app: web-app-pod
  replicas: 3
  template:
    metadata:
      labels:
        app: web-app-pod
    spec:
      containers:
        - name: web-app-c
          image: hassanaym/web-app:1.0.0
          ports:
            - containerPort: 3000
