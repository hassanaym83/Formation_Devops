# LAB 2 - Services et Deployments
#
# Objectifs :
# - Créer des Deployments avec réplication et rolling updates
# - Exposer des applications avec Services ClusterIP et NodePort
# - Comprendre la communication inter-services DNS
#
# Points : 10/30 (LAB 2 application pratique)
# Durée estimée : 2 heures
# Niveau Bloom : 3-Appliquer
#
# Contexte DevOps :
# Déploiement d'une application web 3-tiers avec load balancing
# et haute disponibilité pour environnement de développement

# Namespace pour l'application
apiVersion: v1
kind: Namespace
metadata:
  name: webapp-dev
  labels:
    environment: development
    application: webapp
    team: devops

---
# Deployment Frontend - Interface utilisateur
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: webapp-dev
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
      tier: presentation
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
        version: v1.0.0
    spec:
      containers:
        - name: nginx-frontend
          image: nginx:1.21-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '100m'
          env:
            - name: BACKEND_URL
              value: 'http://backend-service.webapp-dev.svc.cluster.local:3000'
            - name: ENVIRONMENT
              value: 'development'
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Service Frontend - ClusterIP pour communication interne
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: webapp-dev
  labels:
    app: frontend
    tier: presentation
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend
    tier: presentation

---
# Deployment Backend - API Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: webapp-dev
  labels:
    app: backend
    tier: application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
      tier: application
  template:
    metadata:
      labels:
        app: backend
        tier: application
        version: v1.0.0
    spec:
      containers:
        - name: node-backend
          image: node:18-alpine
          command: ['node']
          args:
            [
              '-e',
              "const express = require('express'); const app = express(); app.get('/health', (req, res) => res.json({status: 'healthy', timestamp: new Date().toISOString()})); app.get('/api/users', (req, res) => res.json([{id: 1, name: 'DevOps User', role: 'engineer'}])); app.listen(3000, () => console.log('Backend API running on port 3000'));"
            ]
          ports:
            - containerPort: 3000
              name: api
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: DATABASE_URL
              value: 'postgresql://devops:training123@database-service.webapp-dev.svc.cluster.local:5432/webapp'
            - name: NODE_ENV
              value: 'development'
            - name: LOG_LEVEL
              value: 'info'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Service Backend - ClusterIP pour communication interne
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webapp-dev
  labels:
    app: backend
    tier: application
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: api
  selector:
    app: backend
    tier: application

---
# Deployment Database - PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: webapp-dev
  labels:
    app: database
    tier: data
spec:
  replicas: 1
  strategy:
    type: Recreate # Pas de rolling update pour les DBs
  selector:
    matchLabels:
      app: database
      tier: data
  template:
    metadata:
      labels:
        app: database
        tier: data
        version: v14.0.0
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '300m'
          env:
            - name: POSTGRES_DB
              value: 'webapp'
            - name: POSTGRES_USER
              value: 'devops'
            - name: POSTGRES_PASSWORD
              value: 'training123'
            - name: PGDATA
              value: '/var/lib/postgresql/data/pgdata'
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devops
                - -d
                - webapp
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - devops
                - -d
                - webapp
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Service Database - ClusterIP pour communication interne
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: webapp-dev
  labels:
    app: database
    tier: data
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: database
    tier: data

---
# Service Frontend exposé - NodePort pour accès externe local
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: webapp-dev
  labels:
    app: frontend
    tier: presentation
    exposure: external
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: frontend
    tier: presentation
