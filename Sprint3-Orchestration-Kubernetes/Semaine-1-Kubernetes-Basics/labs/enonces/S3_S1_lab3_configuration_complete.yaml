# LAB 3 - Configuration complète avec ConfigMaps, Secrets et Volumes
#
# Objectifs :
# - Externaliser la configuration avec ConfigMaps
# - Sécuriser les données sensibles avec Secrets
# - Implémenter la persistance avec Volumes
#
# Points : 12/30 (LAB 3 maîtrise avancée)
# Durée estimée : 2 heures
# Niveau Bloom : 4-Analyser
#
# Contexte DevOps :
# Configuration production-ready d'une application avec
# externalisation complète de la configuration et persistance

# Namespace pour l'environnement de production
apiVersion: v1
kind: Namespace
metadata:
  name: webapp-prod
  labels:
    environment: production
    application: webapp
    team: devops
    security: high

---
# ConfigMap - Configuration application non-sensible
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: webapp-prod
  labels:
    app: webapp
    component: configuration
data:
  # Configuration serveur
  server.properties: |
    server.host=0.0.0.0
    server.port=3000
    server.timeout=30000
    server.keepAlive=true

    # Configuration base de données
    database.host=database-service.webapp-prod.svc.cluster.local
    database.port=5432
    database.name=webapp_prod
    database.ssl=true
    database.pool.min=5
    database.pool.max=20
    database.timeout=5000

    # Configuration cache
    cache.host=redis-service.webapp-prod.svc.cluster.local
    cache.port=6379
    cache.ttl=3600
    cache.maxMemory=256mb

    # Configuration logs
    log.level=info
    log.format=json
    log.destination=stdout

    # Configuration monitoring
    metrics.enabled=true
    metrics.port=9090
    metrics.path=/metrics
    health.endpoint=/health

  # Configuration NGINX
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream backend {
            server backend-service.webapp-prod.svc.cluster.local:3000;
        }
        
        server {
            listen 80;
            server_name localhost;
            
            location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }

---
# Secret - Données sensibles
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: webapp-prod
  labels:
    app: webapp
    component: security
type: Opaque
data:
  # Base64 encoded values
  # echo -n "produser" | base64 = cHJvZHVzZXI=
  # echo -n "SuperSecurePassword123!" | base64 = U3VwZXJTZWN1cmVQYXNzd29yZDEyMyE=
  # echo -n "webapp_production" | base64 = d2ViYXBwX3Byb2R1Y3Rpb24=
  database.username: cHJvZHVzZXI=
  database.password: U3VwZXJTZWN1cmVQYXNzd29yZDEyMyE=
  database.name: d2ViYXBwX3Byb2R1Y3Rpb24=

  # JWT secrets
  jwt.secret: and0LXNlY3JldC1rZXktcHJvZHVjdGlvbi0yMDI0

  # API keys
  api.key.external: ZXh0ZXJuYWwtYXBpLWtleS1wcm9kLTEyMzQ1Njc4OQ==

  # Redis password
  redis.password: cmVkaXMtcHJvZC1wYXNzd29yZA==

---
# PersistentVolume - Stockage pour base de données
apiVersion: v1
kind: PersistentVolume
metadata:
  name: database-pv
  labels:
    type: local
    environment: production
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /tmp/k8s-training/database-data

---
# PersistentVolumeClaim - Demande de stockage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-pvc
  namespace: webapp-prod
  labels:
    app: database
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-storage

---
# Deployment Backend avec configuration complète
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: webapp-prod
  labels:
    app: backend
    tier: application
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
      tier: application
  template:
    metadata:
      labels:
        app: backend
        tier: application
        version: v2.0.0
    spec:
      containers:
        - name: node-backend
          image: node:18-alpine
          command: ['node']
          args:
            [
              '-e',
              "const express = require('express'); const app = express(); const config = require('fs').readFileSync('/etc/config/server.properties', 'utf8'); console.log('Loaded config:', config.split('\\n').length, 'lines'); app.get('/health', (req, res) => res.json({status: 'healthy', config: 'loaded', timestamp: new Date().toISOString()})); app.get('/api/config', (req, res) => res.json({message: 'Configuration loaded from ConfigMap and Secrets'})); app.listen(3000, () => console.log('Backend API running with external configuration'));"
            ]
          ports:
            - containerPort: 3000
              name: api
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '300m'
          # Variables d'environnement depuis ConfigMap
          envFrom:
            - configMapRef:
                name: app-config
          # Variables d'environnement depuis Secret
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database.username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database.password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt.secret
          # Montage ConfigMap comme fichier
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: app-config
        - name: nginx-config
          configMap:
            name: app-config
            items:
              - key: nginx.conf
                path: nginx.conf

---
# Service Backend
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webapp-prod
  labels:
    app: backend
    tier: application
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: api
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: backend
    tier: application

---
# Deployment Database avec volume persistant
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: webapp-prod
  labels:
    app: database
    tier: data
    version: v14.0.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: database
      tier: data
  template:
    metadata:
      labels:
        app: database
        tier: data
        version: v14.0.0
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: '512Mi'
              cpu: '200m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database.username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database.password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database.name
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: database-pvc

---
# Service Database
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: webapp-prod
  labels:
    app: database
    tier: data
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: database
    tier: data

---
# Deployment Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: webapp-prod
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: cache
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: '128Mi'
              cpu: '50m'
            limits:
              memory: '256Mi'
              cpu: '100m'
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis.password

---
# Service Redis
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: webapp-prod
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
    tier: cache
