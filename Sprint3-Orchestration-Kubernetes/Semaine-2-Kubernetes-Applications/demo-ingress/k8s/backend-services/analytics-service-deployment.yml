apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service-deployment
  namespace: blood-donation
  labels:
    project: blood-donation
    app: analytics-service
    component: api
    tier: backend
    resource-type: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
      component: api
  template:
    metadata:
      labels:
        project: blood-donation
        app: analytics-service
        component: api
        tier: backend
        resource-type: pod
    spec:
      containers:
        - name: analytics-service-container
          image: hassanaym/bdon-analytics-service:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - configMapRef:
                name: analytics-service-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          

