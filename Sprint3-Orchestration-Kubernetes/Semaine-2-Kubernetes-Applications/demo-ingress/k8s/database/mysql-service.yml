apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: blood-donation
  labels:
    project: blood-donation
    app: mysql
    component: database
    tier: backend
    resource-type: service
spec:
  selector:
    app: mysql
    tier: backend
    component: database
  type: ClusterIP
  ports:
    - name: mysql
      protocol: TCP
      targetPort: 3306
      port: 3306