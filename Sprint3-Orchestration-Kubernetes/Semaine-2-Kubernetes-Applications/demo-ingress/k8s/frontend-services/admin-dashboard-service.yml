apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard-service
  namespace: blood-donation
  labels:
    project: blood-donation
    app: admin-dashboard
    component: web
    tier: frontend
    resource-type: service
spec:
  type: ClusterIP
  selector:
    app: admin-dashboard
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 3200
      targetPort: 3200
  