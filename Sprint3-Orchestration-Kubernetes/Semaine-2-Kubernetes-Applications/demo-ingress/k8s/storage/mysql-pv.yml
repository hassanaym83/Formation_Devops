apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    project: blood-donation
    app: mysql
    component: database
    tier: backend
    resource-type: persistentVolume
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mysql
    type: DirectoryOrCreate
