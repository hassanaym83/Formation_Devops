apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: blood-donation
  labels:
    project: blood-donation
    app: mysql
    component: database
    tier: backend
    resource-type: persistentVolumeClaim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi